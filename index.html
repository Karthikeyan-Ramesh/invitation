<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding e-invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mukta:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dk:#0c0c0c;--gd:#d4af6a;--iv:#f6f1e7;--ink:#2a2420;--d2a:#3a2c12;--d2b:#120d04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--dk);color:var(--iv);font:400 1rem/1.7 Mukta,system-ui,sans-serif}
body[data-t=emerald]{--dk:#0f3d3e;--gd:#f2a93b;--d2a:#1d7a6e;--d2b:#0a2f30}
body[data-t=maroon]{--dk:#4a0f1c;--gd:#e6b95c;--d2a:#8a2038;--d2b:#2c0710}
.dk.d1{background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--gd) 25%,transparent),transparent 65%),var(--dk)}
.dk.d2{background:linear-gradient(160deg,var(--d2a),var(--d2b))}
.hide{display:none!important}
.s{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 22px}
.dk{background:var(--dk);color:var(--iv)}.lt{background:var(--iv);color:var(--ink)}
.sc{font-family:"Pinyon Script",cursive;color:var(--gd)}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
h2{font-size:clamp(2rem,8vw,3rem)}
.lt h2{color:#6b4f2a}
.names{font-family:"Pinyon Script",cursive;font-size:clamp(3rem,16vw,6rem);line-height:1.1;color:var(--iv);margin:14px 0}
.names i{color:var(--gd);font-size:.6em}
.hero{background:linear-gradient(#0008,#000b),radial-gradient(circle at 50% 30%,#fff2,transparent 60%),var(--dk);background-size:cover;background-position:center}
.hero p{margin:4px 0;letter-spacing:.12em;font-size:.9rem}
.p{max-width:460px;margin:12px auto}
.cd{display:flex;gap:10px;justify-content:center;margin:26px 0}
.cd div{border:1px solid var(--gd);padding:12px 4px;min-width:70px}
.cd b{display:block;font:600 2rem "Cormorant Garamond",serif;color:var(--gd)}
.cd span{font-size:.75rem;opacity:.8}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;width:100%;margin-top:20px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:6px;aspect-ratio:3/4}
.btn{display:inline-block;background:var(--gd);color:#1a1200;border:0;padding:13px 26px;border-radius:999px;font:500 1rem Mukta,sans-serif;text-decoration:none;cursor:pointer;margin:8px 6px}
.btn.o{background:transparent;color:inherit;border:1px solid var(--gd)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.mk{width:12px;height:12px;border-radius:50%;background:var(--gd);margin:0 auto 14px}
/* motion */
.hero{position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.pt{position:absolute!important;top:-50px;z-index:0!important;opacity:.9;animation:fall linear infinite}
.pt svg{display:block;animation:sway ease-in-out infinite alternate}
.sp{position:absolute!important;z-index:0!important;opacity:0;animation:tw ease-in-out infinite;filter:drop-shadow(0 0 4px #ffd36b)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(480deg)}}
@keyframes sway{from{margin-left:-22px}to{margin-left:22px}}
@keyframes bloom{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.fl{display:block;margin:0 auto 14px;width:44px;height:44px}
.fl svg{width:100%;height:100%;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes kb{to{background-size:112%}}
@keyframes ln{from{width:0}to{width:90px}}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes glow{50%{box-shadow:0 0 0 8px #d4af6a22}}
.hero.go>p:first-of-type{animation:up 1s .3s both}
.hero.go .hb{animation:bloom 1.6s .1s both}
.hero.go .names{animation:up 1.2s .8s both}
.hero.go .names{background:linear-gradient(110deg,var(--iv) 40%,var(--gd) 50%,var(--iv) 60%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:up 1.2s .8s both,sh 4s 2.2s linear infinite}
.hero.go .names i{-webkit-text-fill-color:var(--gd)}
.hero.go .sc{animation:up 1s 1.6s both}
.hero.go>p:nth-of-type(2){animation:up 1s 2s both}
.hero.go>p:last-child{animation:up 1s 2.6s both,glow 2s 3.6s infinite}
.hero.go:after{content:"";display:block;height:1px;background:var(--gd);margin-top:22px;animation:ln 1.4s 2.2s both}
.hero.kb{background-size:100%;animation:kb 14s ease-out forwards}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.cd b.pp{animation:pop .5s}
.mk{animation:glow 2.4s infinite}
.btn{transition:transform .2s}.btn:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.pt,.sp{display:none}.rv{opacity:1;transform:none;transition:none}.hero *,.hero{animation:none!important}}
/* envelope intro */
#op{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--gd) 22%,transparent),transparent 60%),var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer;transition:opacity 1.1s,transform 1.1s;padding:20px}
#op:focus-visible{outline:3px solid var(--gd);outline-offset:-6px}
#op .hi{font-size:1.1rem;letter-spacing:.14em;opacity:.85;margin:0}
.env{position:relative;width:min(310px,80vw);height:min(205px,53vw);perspective:900px;filter:drop-shadow(0 18px 30px #0008)}
.env>*{position:absolute}
.env .bk{inset:0;background:#cdb98e;border-radius:6px}
.env .cd2{left:8%;right:8%;top:5%;height:82%;background:var(--iv);color:var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1;transition:transform 1.1s cubic-bezier(.3,.8,.3,1) .7s}
.env .cd2 span{font:2rem/1.1 "Pinyon Script",cursive;color:#6b4f2a}
.env .cd2 small{font-size:.7rem;letter-spacing:.14em;margin-top:6px}
.env .fr{inset:0;background:linear-gradient(135deg,#f3e8cf,#e4d3a8);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:2;border-radius:6px}
.env .fp{left:0;right:0;top:0;height:58%;background:linear-gradient(#e9dbb8,#d8c598);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:3;transition:transform .8s ease,z-index 0s .4s}
.env .sl{left:50%;top:56%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2fb67c,#0b6b48 70%);color:#f5c542;text-shadow:0 1px 2px #0006;font:1.35rem/58px "Pinyon Script",cursive;text-align:center;z-index:4;animation:sealp 1.8s ease-in-out infinite;transition:transform .4s,opacity .4s}
@keyframes sealp{50%{transform:scale(1.1);box-shadow:0 0 0 12px #d4af6a33}}
#op .tap{margin:0;font-size:.9rem;letter-spacing:.2em;animation:tp 1.6s ease-in-out infinite}
@keyframes tp{50%{opacity:.35}}
#op.open .sl{animation:none;transform:scale(0);opacity:0}
#op.open .fp{transform:rotateX(180deg);z-index:0}
#op.open .cd2{transform:translateY(-62%)}
#op.open .tap{opacity:0;animation:none}
@media (prefers-reduced-motion:reduce){#op *{animation:none!important}}
/* editor */
#ed{max-width:560px;margin:0 auto;padding:32px 20px 60px}
#ed h1{font-size:2.2rem;color:var(--gd)}
label{display:block;margin-top:14px;font-size:.9rem;color:var(--gd)}
input,select,textarea{width:100%;padding:11px 12px;margin-top:4px;border-radius:6px;border:1px solid #fff4;background:#fff1;color:var(--iv);font:inherit}
select option{color:#000}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#lk{font-size:.8rem}
.tip{font-size:.85rem;opacity:.75;margin:6px 0}
</style>
</head>
<body data-t="emerald">
<div id="ed">
<h1>Wedding e-invitation maker</h1>
<p>Fill in your details, preview the invitation, then copy the share link to send on WhatsApp.</p>
<div class="row"><div><label for="g">Groom</label><input id="g" value="Karthikeyan"></div><div><label for="b">Bride</label><input id="b" value="Varsha"></div></div>
<label for="tag">Tagline</label><input id="tag" value="Our new beginning">
<label for="host">Hosted by (optional)</label><input id="host" placeholder="With the blessings of our families">
<div class="row"><div><label for="date">Wedding date</label><input id="date" type="date" value="2027-01-24"></div><div><label for="time">Time</label><input id="time" type="time" value="07:30"></div></div>
<label for="ev2">Other event (optional)</label><input id="ev2" placeholder="Reception: 23 Jan, 7:00 PM onwards">
<label for="msg">Message</label><textarea id="msg" rows="3">With hearts full of gratitude, we invite you to share in the joy of our wedding. Your presence and blessings will make our day complete.</textarea>
<label for="th">Colour theme</label><select id="th"><option value="emerald" selected>Emerald and marigold</option><option value="noir">Black and gold</option><option value="maroon">Maroon and gold</option></select>
<p class="tip">Images are loaded automatically from the <b>images</b> folder: <b>seal.jpg</b> (envelope seal) and <b>photo1.jpg</b> to <b>photo5.jpg</b> (photo1 is the cover). .jpg, .jpeg, .png and .webp all work.</p>
<div><button class="btn" id="pv">Preview</button><button class="btn o" id="sh">Copy share link</button></div>
<input id="lk" readonly class="hide" aria-label="Share link">
<p class="tip" id="st" role="status"></p>
</div>
<div id="iv" class="hide"></div>

var EXT=["jpg","jpeg","png","webp"];
function probe(base,done){var i=0;(function next(){if(i>=EXT.length){done("");return}var p="images/"+base+"."+EXT[i++],im=new Image();im.onload=function(){done(p)};im.onerror=next;im.src=p})()}
